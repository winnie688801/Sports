<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>線上課程預約系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS 官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { font-family: 'Noto Sans TC', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col text-sm sm:text-base">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-100 flex-shrink-0">
                    <i class="fa-solid fa-graduation-cap text-xl sm:text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg sm:text-2xl text-slate-900 leading-tight">課程預約系統</h1>
                    <p class="text-xs sm:text-sm text-slate-500 font-medium">雲端資料同步與即時月結試算</p>
                </div>
            </div>

            <!-- 右側權限與身分切換按鈕區 -->
            <div id="auth-controls" class="flex items-center space-x-2">
                <button id="btn-open-login" onclick="openLoginModal()" class="px-3.5 py-2 sm:px-5 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-700 hover:text-indigo-600 bg-slate-100 hover:bg-slate-200 transition flex items-center shadow-sm">
                    <i class="fa-solid fa-lock mr-1.5"></i>管理員登入
                </button>

                <div id="admin-logged-controls" class="hidden flex items-center space-x-1.5 sm:space-x-3">
                    <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                        <button id="btn-role-user" onclick="switchRole('user')" class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-xs sm:text-sm font-bold transition-all bg-white text-indigo-600 shadow-sm">
                            <i class="fa-solid fa-user mr-1"></i>學員端
                        </button>
                        <button id="btn-role-admin" onclick="switchRole('admin')" class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-600 hover:text-slate-900 transition-all">
                            <i class="fa-solid fa-user-shield mr-1"></i>後台
                        </button>
                    </div>
                    <button onclick="handleLogout()" class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 transition whitespace-nowrap">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i>登出
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-5 sm:py-10 w-full">

        <!-- ======================= 1. 一般使用者介面 ======================= -->
        <div id="view-user" class="space-y-6 sm:space-y-8">
            <div class="bg-white p-5 sm:p-7 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3 sm:space-x-4">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl sm:text-2xl font-bold flex-shrink-0">
                        <i class="fa-regular fa-circle-user"></i>
                    </div>
                    <div>
                        <label class="text-xs sm:text-sm text-slate-500 font-medium">預約人姓名（支援使用逗號或頓號分開輸入多位）</label>
                        <input type="text" id="user-name-input" value="" placeholder="如：王小明、蔡小華" class="w-full font-extrabold text-slate-900 text-lg sm:text-xl focus:outline-none border-b-2 border-dashed border-slate-300 focus:border-indigo-600 bg-transparent py-0.5" oninput="renderUserView()">
                    </div>
                </div>

                <!-- 篩選列 -->
                <div class="flex flex-wrap items-center gap-3 pt-2 md:pt-0 border-t md:border-t-0 border-slate-100">
                    <div class="flex items-center space-x-2">
                        <label class="text-xs sm:text-sm font-bold text-slate-700 whitespace-nowrap">月份：</label>
                        <input type="month" id="user-month-filter" class="text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-slate-800 focus:outline-none focus:border-indigo-600 font-medium" onchange="renderUserView()">
                    </div>
                    <div class="flex items-center space-x-2">
                        <label class="text-xs sm:text-sm font-bold text-slate-700 whitespace-nowrap">課程：</label>
                        <select id="user-course-filter" class="text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-slate-800 focus:outline-none focus:border-indigo-600 font-bold" onchange="renderUserView()">
                            <option value="ALL">全部課程</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">
                <div class="lg:col-span-2 space-y-4 sm:space-y-5">
                    <div class="space-y-2">
                        <h2 class="font-extrabold text-slate-900 text-lg sm:text-xl flex items-center">
                            <i class="fa-solid fa-clock mr-2 text-indigo-600"></i>開放預約時段（僅顯示未過期）
                        </h2>
                        <div id="user-available-count" class="flex flex-wrap gap-1.5 text-xs sm:text-sm font-bold">
                            <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full">連線中...</span>
                        </div>
                    </div>

                    <div id="user-slot-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5"></div>
                </div>

                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-gradient-to-br from-indigo-900 via-slate-900 to-indigo-950 text-white p-6 sm:p-7 rounded-2xl shadow-xl">
                        <span class="text-xs sm:text-sm text-indigo-300 font-semibold tracking-wide">當月費用試算 (應繳金額)</span>
                        <div class="flex items-baseline mt-2 mb-4 sm:mt-3 sm:mb-5">
                            <span class="text-base sm:text-lg font-normal text-slate-300 mr-1.5">NT$</span>
                            <h3 id="user-total-fee" class="text-4xl sm:text-5xl font-black tracking-tight text-white">0</h3>
                        </div>
                        <div class="text-xs sm:text-sm text-slate-300 border-t border-white/15 pt-3 sm:pt-4 flex justify-between items-center">
                            <span>當月已報名場次：</span>
                            <span id="user-booked-count" class="font-extrabold text-base sm:text-lg text-emerald-400">0 場</span>
                        </div>
                    </div>

                    <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-900 text-sm sm:text-base flex items-center justify-between pb-2 border-b border-slate-100">
                            <span>我的已預約明細</span>
                            <i class="fa-solid fa-receipt text-slate-400"></i>
                        </h3>
                        <div id="user-booked-list" class="space-y-3 divide-y divide-slate-100"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ======================= 2. 管理員介面 ======================= -->
        <div id="view-admin" class="hidden space-y-6 sm:space-y-8">
            <div class="bg-white p-5 sm:p-7 rounded-2xl border border-slate-200 shadow-sm space-y-5">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-slate-100 pb-4 gap-2">
                    <div>
                        <h2 class="font-extrabold text-slate-900 text-base sm:text-lg flex items-center">
                            <i class="fa-solid fa-plus-circle text-indigo-600 mr-2"></i>開放新課程時段設定
                        </h2>
                        <p class="text-xs sm:text-sm text-slate-500 mt-0.5">填寫課程名稱、起訖時間與多選日期進行批次發布</p>
                    </div>
                    <span class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full font-bold self-start sm:self-auto">5 分鐘單位</span>
                </div>

                <form id="admin-create-form" onsubmit="handleCreateSlots(event)" class="space-y-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        <div class="sm:col-span-2 lg:col-span-1">
                            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5">課程名稱</label>
                            <input type="text" id="admin-course-name" required placeholder="如：瑜珈初階班" class="w-full text-sm sm:text-base bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:border-indigo-600 focus:outline-none font-bold text-slate-800">
                        </div>

                        <div>
                            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5">開始時間</label>
                            <div class="flex items-center space-x-2 bg-slate-50 border border-slate-300 rounded-xl p-2 sm:p-2.5 focus-within:border-indigo-600 focus-within:bg-white transition">
                                <select id="admin-start-hour" class="bg-transparent text-sm sm:text-base text-slate-800 font-bold focus:outline-none w-full text-center cursor-pointer" onchange="autoAdjustEndTime()"></select>
                                <span class="font-black text-slate-400 text-base sm:text-lg select-none">:</span>
                                <select id="admin-start-min" class="bg-transparent text-sm sm:text-base text-slate-800 font-bold focus:outline-none w-full text-center cursor-pointer" onchange="autoAdjustEndTime()"></select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5">結束時間</label>
                            <div class="flex items-center space-x-2 bg-slate-50 border border-slate-300 rounded-xl p-2 sm:p-2.5 focus-within:border-indigo-600 focus-within:bg-white transition">
                                <select id="admin-end-hour" class="bg-transparent text-sm sm:text-base text-slate-800 font-bold focus:outline-none w-full text-center cursor-pointer"></select>
                                <span class="font-black text-slate-400 text-base sm:text-lg select-none">:</span>
                                <select id="admin-end-min" class="bg-transparent text-sm sm:text-base text-slate-800 font-bold focus:outline-none w-full text-center cursor-pointer"></select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5">每場人數上限</label>
                            <input type="number" id="admin-capacity" min="1" value="5" required class="w-full text-sm sm:text-base bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:border-indigo-600 focus:outline-none font-semibold">
                        </div>

                        <div>
                            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5">預設單場費用 (NT$)</label>
                            <input type="number" id="admin-price" min="0" value="270" required class="w-full text-sm sm:text-base bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:border-indigo-600 focus:outline-none font-semibold">
                        </div>
                    </div>

                    <div class="space-y-3 pt-3 border-t border-slate-100">
                        <label class="block text-xs sm:text-sm font-bold text-slate-700">選擇欲開放的日期（可多選）</label>
                        <div class="flex flex-wrap items-center gap-2.5">
                            <input type="date" id="admin-date-picker" class="text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-xl p-2 sm:p-2.5 focus:border-indigo-600 focus:outline-none font-medium flex-grow sm:flex-grow-0">
                            <button type="button" onclick="addSelectedDate()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs sm:text-sm font-bold px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl border border-slate-300 transition whitespace-nowrap">
                                <i class="fa-solid fa-plus mr-1"></i>加入日期
                            </button>
                            <span class="text-xs text-slate-500 font-medium">已選 <strong id="selected-date-count" class="text-indigo-600 text-sm font-extrabold">0</strong> 個</span>
                        </div>
                        <div id="selected-dates-container" class="flex flex-wrap gap-2 min-h-[44px] p-2.5 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                            <span class="text-slate-400 text-xs self-center px-2">尚未加入任何日期</span>
                        </div>
                    </div>

                    <div class="flex justify-end pt-2">
                        <button type="submit" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-sm sm:text-base font-bold px-8 py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>
                            <span>確認批次發布至雲端</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- 時段管理清單與篩選器 -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden space-y-4">
                <div class="p-5 sm:p-6 border-b border-slate-100 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                    <div>
                        <h3 class="font-extrabold text-slate-900 text-base sm:text-lg flex items-center">
                            <i class="fa-solid fa-list-check text-slate-700 mr-2"></i>開放時段管理清單
                        </h3>
                        <p id="admin-filtered-count" class="text-xs text-slate-400 mt-0.5">載入中...</p>
                    </div>

                    <div class="flex flex-wrap items-center gap-2.5">
                        <!-- 月份篩選 -->
                        <div class="flex items-center space-x-1.5 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                            <span class="text-xs font-bold text-slate-600 whitespace-nowrap"><i class="fa-regular fa-calendar mr-1"></i>月份：</span>
                            <input type="month" id="admin-month-filter" class="text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1 focus:outline-none focus:border-indigo-600 font-medium" onchange="renderAdminView()">
                            <button type="button" onclick="clearAdminMonthFilter()" class="text-xs text-slate-400 hover:text-slate-600 px-1 font-bold" title="顯示全部月份">全部</button>
                        </div>

                        <!-- 課程篩選 -->
                        <div class="flex items-center space-x-1.5 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                            <span class="text-xs font-bold text-slate-600 whitespace-nowrap"><i class="fa-solid fa-graduation-cap mr-1"></i>課程：</span>
                            <select id="admin-course-filter" class="text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1 focus:outline-none focus:border-indigo-600 font-bold" onchange="renderAdminView()">
                                <option value="ALL">全部課程</option>
                            </select>
                        </div>

                        <!-- 整批調費 -->
                        <div class="flex items-center space-x-1.5 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                            <span class="text-xs font-bold text-slate-700 whitespace-nowrap">整批調費：</span>
                            <input type="number" id="batch-price-input" placeholder="金額" class="w-16 sm:w-20 text-xs bg-white border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:border-indigo-600 font-semibold">
                            <button onclick="handleBatchUpdatePrice()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-2.5 py-1 rounded-lg transition font-bold whitespace-nowrap">
                                套用
                            </button>
                        </div>
                    </div>
                </div>

                <div class="overflow-x-auto w-full">
                    <table class="w-full text-left text-xs sm:text-sm text-slate-600 min-w-[680px]">
                        <thead class="bg-slate-50 text-slate-800 uppercase font-bold border-b border-slate-200 text-[11px] sm:text-xs tracking-wider">
                            <tr>
                                <th class="px-4 py-3 sm:px-6 sm:py-4">課程名稱 / 時段</th>
                                <th class="px-4 py-3 sm:px-6 sm:py-4">名額狀態</th>
                                <th class="px-4 py-3 sm:px-6 sm:py-4">單場費用 (NT$)</th>
                                <th class="px-4 py-3 sm:px-6 sm:py-4">已報名名單</th>
                                <th class="px-4 py-3 sm:px-6 sm:py-4 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-slot-tbody" class="divide-y divide-slate-100 font-sans"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- 管理員登入 Modal -->
    <div id="login-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
                        <i class="fa-solid fa-shield-halved text-base"></i>
                    </div>
                    <h3 class="font-extrabold text-lg sm:text-xl text-slate-900">管理員驗證</h3>
                </div>
                <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">管理者帳號</label>
                    <input type="text" id="admin-username" required class="w-full text-sm sm:text-base bg-slate-50 border border-slate-300 rounded-xl p-2.5 sm:p-3 focus:outline-none focus:border-indigo-600 font-medium" placeholder="請輸入帳號">
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">管理者密碼</label>
                    <input type="password" id="admin-password" required class="w-full text-sm sm:text-base bg-slate-50 border border-slate-300 rounded-xl p-2.5 sm:p-3 focus:outline-none focus:border-indigo-600 font-medium" placeholder="請輸入密碼">
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 sm:py-3 rounded-xl shadow-md transition text-sm sm:text-base">
                        確認登入
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 管理員編輯時段 Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold">
                        <i class="fa-solid fa-pen-to-square text-base"></i>
                    </div>
                    <h3 class="font-extrabold text-lg sm:text-xl text-slate-900">編輯時段內容</h3>
                </div>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="handleSaveEditedSlot(event)" class="space-y-4">
                <input type="hidden" id="edit-slot-id">

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs sm:text-sm font-bold text-slate-700">課程名稱</label>
                        <span class="text-[11px] text-amber-600 font-bold bg-amber-50 px-2 py-0.5 rounded"><i class="fa-solid fa-lock mr-1"></i>名稱不可變更</span>
                    </div>
                    <input type="text" id="edit-course-name" readonly disabled class="w-full text-sm sm:text-base bg-slate-100 border border-slate-200 rounded-xl p-2.5 font-bold text-slate-500 cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">開放日期</label>
                    <input type="date" id="edit-date" required class="w-full text-sm sm:text-base bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 font-medium">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">開始時間</label>
                        <div class="flex items-center space-x-1 bg-slate-50 border border-slate-300 rounded-xl p-2 focus-within:border-indigo-600 focus-within:bg-white">
                            <select id="edit-start-hour" class="bg-transparent text-sm font-bold focus:outline-none w-full text-center"></select>
                            <span class="font-black text-slate-400">:</span>
                            <select id="edit-start-min" class="bg-transparent text-sm font-bold focus:outline-none w-full text-center"></select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">結束時間</label>
                        <div class="flex items-center space-x-1 bg-slate-50 border border-slate-300 rounded-xl p-2 focus-within:border-indigo-600 focus-within:bg-white">
                            <select id="edit-end-hour" class="bg-transparent text-sm font-bold focus:outline-none w-full text-center"></select>
                            <span class="font-black text-slate-400">:</span>
                            <select id="edit-end-min" class="bg-transparent text-sm font-bold focus:outline-none w-full text-center"></select>
                        </div>
                    </div>
                </div>

        function getTodayString() {

            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function sortSlotsChronologically(slotArray) {
            return slotArray.sort((a, b) => {
                const aTime = (a.time || '').split(' - ')[0] || '00:00';
                const bTime = (b.time || '').split(' - ')[0] || '00:00';
                return new Date(`${a.date}T${aTime}`) - new Date(`${b.date}T${bTime}`);
            });
        }

        // 從 Supabase 抓取資料並自動格式化
        async function fetchSlotsFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('slots')
                    .select('*');

                if (error) throw error;

                // 強化相容：同時支援 course_name 與 courseName
                slots = (data || []).map(item => ({
                    id: item.id,
                    courseName: item.course_name || item.courseName || '一般課程',
                    date: item.date,

                    capacity: item.capacity,
                    price: item.price,
                    bookedUsers: item.booked_users || item.bookedUsers || []
                }));

                updateCourseFilterDropdown();

                if (currentRole === 'user') renderUserView();
                else renderAdminView();
            } catch (err) {
                console.error('Supabase 載入錯誤:', err);

        // ======================= 使用者端邏輯 =======================
        function renderUserView() {
            const inputNames = parseInputNames();
            const selectedMonth = document.getElementById('user-month-filter').value;
            const selectedCourse = document.getElementById('user-course-filter')?.value || 'ALL';
            const container = document.getElementById('user-slot-list');
            const bookedContainer = document.getElementById('user-booked-list');
            const countContainer = document.getElementById('user-available-count');
            const todayStr = getTodayString();

            let validSlots = slots.filter(s => {
                const inMonth = s.date && s.date.startsWith(selectedMonth);
                const notExpired = s.date >= todayStr;
                const matchCourse = selectedCourse === 'ALL' || s.courseName === selectedCourse;
                return inMonth && notExpired && matchCourse;
            });
            validSlots = sortSlotsChronologically(validSlots);
        
            // 統計徽章
            let availableCount = 0, fullCount = 0, almostFullCount = 0;
            validSlots.forEach(s => {
                const bookedNum = (s.bookedUsers || []).length;
                const remaining = s.capacity - bookedNum;
                if (remaining > 0) availableCount++;
                else fullCount++;
            
                if (s.capacity > 1 && remaining === 1) almostFullCount++;
            });
        
            if (countContainer) {
                countContainer.innerHTML = `
                    <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full whitespace-nowrap">

                    const remaining = s.capacity - bookedList.length;
                    const isFull = remaining <= 0 && myBookedInThisSlot.length === 0;
                    const isAlmostFull = s.capacity > 1 && remaining === 1 && myBookedInThisSlot.length === 0;
                
                    return `
                        <div class="p-5 sm:p-6 rounded-2xl border transition-all ${myBookedInThisSlot.length > 0 ? 'bg-indigo-50/60 border-indigo-300 ring-2 ring-indigo-500' : 'bg-white border-slate-200'} shadow-sm space-y-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                                        <span class="text-xs font-black text-white bg-indigo-600 px-2.5 py-0.5 rounded-lg">${s.courseName}</span>
                                        <span class="text-xs font-extrabold text-indigo-700 bg-indigo-50 border border-indigo-100 px-2.5 py-0.5 rounded-lg">${s.date}</span>
                                    </div>
                                    <h4 class="font-extrabold text-slate-900 text-base sm:text-lg mt-1.5 tracking-tight">${s.time}</h4>
                                </div>
                                <div class="text-right">
                                    <span class="text-lg sm:text-xl font-black text-slate-900">NT$ ${s.price}</span>
                                    ${isAlmostFull ? '<span class="block text-[11px] font-bold text-amber-600 mt-0.5">即將額滿</span>' : ''}
                                </div>
                            </div>
                        
                            <div class="flex items-center justify-between text-xs sm:text-sm text-slate-500 pt-2.5 border-t border-slate-100">
                                <span class="font-medium">名額：<strong class="text-sm sm:text-base ${remaining <= 1 ? 'text-rose-600' : 'text-slate-800'} font-extrabold">${remaining}</strong> / ${s.capacity}</span>

                                ${myBookedInThisSlot.length > 0 ? `
                                    <button onclick="cancelBooking('${s.id}')" class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold transition text-xs sm:text-sm">
                                        <i class="fa-solid fa-xmark mr-1"></i>取消預約 (${myBookedInThisSlot.length}人)
                                    </button>
                                ` : isFull ? `
                                    <span class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-slate-100 text-slate-400 font-bold cursor-not-allowed text-xs sm:text-sm">已額滿</span>
                                ` : `
                                    <button onclick="bookSlot('${s.id}')" class="px-4 py-1.5 sm:px-5 sm:py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-md transition text-xs sm:text-sm">
                                        <i class="fa-solid fa-plus mr-1"></i>預約報名 ${inputNames.length > 1 ? `(${inputNames.length}人)` : ''}
                                    </button>
                                `}
                            </div>
                        
                            <div class="pt-1">
                                <button onclick="bookAllCourseSlots('${s.courseName}')" class="w-full text-center py-1.5 text-xs text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50/80 rounded-lg transition font-bold border border-dashed border-indigo-200">
                                    <i class="fa-solid fa-layer-group mr-1"></i>批次報名「${s.courseName}」所有時段 ${inputNames.length > 1 ? `(${inputNames.length}人)` : ''}

            // 計算當月所有已報名人次與應繳總金額

            let totalBookedHeadcount = 0;
            const bookedDetails = [];
        
            slots.filter(s => s.date && s.date.startsWith(selectedMonth)).forEach(s => {
                const bookedList = s.bookedUsers || [];
                // 找出本時段有哪些人是當前輸入名單中的
                const matched = inputNames.filter(name => bookedList.includes(name));
                if (matched.length > 0) {
                    totalBookedHeadcount += matched.length;
                    totalFee += s.price * matched.length;
                    bookedDetails.push({
                        slot: s,
                        names: matched,
                        subtotal: s.price * matched.length
                    });
                }
            });
        
            document.getElementById('user-total-fee').innerText = totalFee.toLocaleString();
            document.getElementById('user-booked-count').innerText = `${totalBookedHeadcount} 人次`;
        
            if (bookedDetails.length === 0) {
                bookedContainer.innerHTML = `<p class="text-slate-400 text-center py-5 text-xs sm:text-sm">本月尚未報名任何時段</p>`;

                bookedContainer.innerHTML = bookedDetails.map(item => {
                    const s = item.slot;
                    const isPast = s.date < todayStr;
                    return `
                        <div class="pt-3 first:pt-0 flex items-center justify-between">

                                </p>
                                <span class="text-xs text-slate-500 font-medium">學員：${item.names.join('、')} (${item.names.length}人) | 小計：NT$ ${item.subtotal}</span>

                            ${!isPast ? `
                                <button onclick="cancelBooking('${s.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-bold px-2 py-1 rounded hover:bg-rose-50 transition">取消</button>
                            ` : '<span class="text-[11px] text-slate-400">已結算</span>'}

        // 1. 解析姓名輸入字串（支援半形/全形逗號、頓號、斜線、空白）
        function parseInputNames() {
            const rawInput = document.getElementById('user-name-input').value.trim();
            if (!rawInput) return [];

            // 使用正規表達式切分多個姓名
            const names = rawInput.split(/[,，、\n\r/ ]+/)
                .map(n => n.trim())
                .filter(n => n.length > 0);

            // 去除重複輸入的名字
            return Array.from(new Set(names));
        }

        // 2. 單場報名：自動支援多名額預約
        async function bookSlot(slotId) {
            const inputNames = parseInputNames();
            if (inputNames.length === 0) return alert('請先輸入預約人姓名！');
        
            const target = slots.find(s => s.id === slotId);
            if (!target) return;
        
            const currentBooked = target.bookedUsers || [];
            const remaining = target.capacity - currentBooked.length;
        
            // 檢查剩餘名額是否足夠
            if (inputNames.length > remaining) {
                return alert(`名額不足！此時段僅剩 ${remaining} 個名額，您輸入了 ${inputNames.length} 位姓名（${inputNames.join(', ')}）。`);
            }
        
            // 檢查是否有已經報名過的姓名
            const duplicateNames = inputNames.filter(name => currentBooked.includes(name));
            if (duplicateNames.length > 0) {
                return alert(`以下人員已在報名名單中，請勿重複報名：${duplicateNames.join(', ')}`);
            }
        
            const updatedUsers = [...currentBooked, ...inputNames];
        
            const { error } = await supabaseClient
                .from('slots')
                .update({ booked_users: updatedUsers })
                .eq('id', slotId);
        
            if (error) return alert('預約失敗：' + error.message);
        
            alert(`成功預約 ${inputNames.length} 位（${inputNames.join('、')}）！`);
            await fetchSlotsFromSupabase();
        }

        // 3. 取消報名：支援移除當前輸入的所有姓名
        async function cancelBooking(slotId) {
            const inputNames = parseInputNames();
            if (inputNames.length === 0) return alert('請先輸入預約人姓名！');
        
            const target = slots.find(s => s.id === slotId);
            if (!target) return;
        
            const currentBooked = target.bookedUsers || [];
            // 移除符合輸入姓名的名單
            const updatedUsers = currentBooked.filter(u => !inputNames.includes(u));
        
            if (currentBooked.length === updatedUsers.length) {
                return alert(`目前預約名單中無符合的姓名（${inputNames.join(', ')}）！`);
            }
        
            const { error } = await supabaseClient
                .from('slots')
                .update({ booked_users: updatedUsers })
                .eq('id', slotId);
        
            if (error) return alert('取消失敗：' + error.message);
        
            alert(`已為您取消預約！`);
            await fetchSlotsFromSupabase();
        }

        // 4. 批次報名該課程：自動判斷多位名額
        async function bookAllCourseSlots(courseName) {
            const inputNames = parseInputNames();
            if (inputNames.length === 0) return alert('請先輸入預約人姓名！');
        
            const todayStr = getTodayString();
            const selectedMonth = document.getElementById('user-month-filter').value;
            const countNeeded = inputNames.length;
        
            // 找出名額足夠容納這幾位、且這幾位皆未報名過的時段
            const targetSlots = slots.filter(s => {
                if (s.courseName !== courseName || !s.date.startsWith(selectedMonth) || s.date < todayStr) return false;

                const currentBooked = s.bookedUsers || [];
                const remaining = s.capacity - currentBooked.length;
                const hasAlreadyBooked = inputNames.some(name => currentBooked.includes(name));
            
                return !hasAlreadyBooked && remaining >= countNeeded;
            });
        
            if (targetSlots.length === 0) {
                return alert(`目前當月份沒有足夠容納 ${countNeeded} 位的「${courseName}」時段！`);
            }
        
            if (!confirm(`確定要為 ${countNeeded} 位（${inputNames.join('、')}）一次報名 ${targetSlots.length} 個「${courseName}」的時段嗎？`)) return;
        
            try {
                for (const slot of targetSlots) {
                    const updatedUsers = [...(slot.bookedUsers || []), ...inputNames];
                    await supabaseClient
                        .from('slots')
                        .update({ booked_users: updatedUsers })
                        .eq('id', slot.id);
                }
            
                alert(`已成功批次報名 ${targetSlots.length} 場「${courseName}」課程！`);
                await fetchSlotsFromSupabase();
            } catch (err) {
                alert('批次報名發生錯誤：' + err.message);
            }
        }
        // ======================= 管理員端邏輯 =======================
        function initTimeOptions() {
            const startHour = document.getElementById('admin-start-hour');
            const startMin = document.getElementById('admin-start-min');
            const endHour = document.getElementById('admin-end-hour');
            const endMin = document.getElementById('admin-end-min');
            
            if (!startHour || !startMin || !endHour || !endMin) return;

            startHour.innerHTML = ''; endHour.innerHTML = '';
            startMin.innerHTML = ''; endMin.innerHTML = '';

            for (let h = 0; h < 24; h++) {
                const hStr = String(h).padStart(2, '0');
                startHour.innerHTML += `<option value="${hStr}">${hStr}</option>`;
                endHour.innerHTML += `<option value="${hStr}">${hStr}</option>`;
            }

            for (let m = 0; m < 60; m += 5) {
                const mStr = String(m).padStart(2, '0');
                startMin.innerHTML += `<option value="${mStr}">${mStr}</option>`;
                endMin.innerHTML += `<option value="${mStr}">${mStr}</option>`;
            }

            startHour.value = '09'; startMin.value = '00';
            endHour.value = '10'; endMin.value = '00';
        }

        function initEditTimeOptions() {
            const startHour = document.getElementById('edit-start-hour');
            const startMin = document.getElementById('edit-start-min');
            const endHour = document.getElementById('edit-end-hour');
            const endMin = document.getElementById('edit-end-min');

            if (!startHour || !startMin || !endHour || !endMin) return;

            startHour.innerHTML = ''; endHour.innerHTML = '';
            startMin.innerHTML = ''; endMin.innerHTML = '';

            for (let h = 0; h < 24; h++) {
                const hStr = String(h).padStart(2, '0');
                startHour.innerHTML += `<option value="${hStr}">${hStr}</option>`;
                endHour.innerHTML += `<option value="${hStr}">${hStr}</option>`;
            }

            for (let m = 0; m < 60; m += 5) {
                const mStr = String(m).padStart(2, '0');
                startMin.innerHTML += `<option value="${mStr}">${mStr}</option>`;
                endMin.innerHTML += `<option value="${mStr}">${mStr}</option>`;
            }
        }

        function autoAdjustEndTime() {
            const sH = parseInt(document.getElementById('admin-start-hour').value);
            const sM = parseInt(document.getElementById('admin-start-min').value);
            
            let totalMins = sH * 60 + sM + 60;
            if (totalMins >= 24 * 60) totalMins = (24 * 60) - 5;

            document.getElementById('admin-end-hour').value = String(Math.floor(totalMins / 60)).padStart(2, '0');
            document.getElementById('admin-end-min').value = String(totalMins % 60).padStart(2, '0');
        }

        function addSelectedDate() {
            const dateInput = document.getElementById('admin-date-picker');
            const dateVal = dateInput.value;
            if (!dateVal) return alert('請先選擇日期！');
            if (selectedBatchDates.includes(dateVal)) return alert('該日期已在清單中！');

            selectedBatchDates.push(dateVal);
            selectedBatchDates.sort();
            renderSelectedDates();
        }

        function removeSelectedDate(dateVal) {
            selectedBatchDates = selectedBatchDates.filter(d => d !== dateVal);
            renderSelectedDates();
        }

        function renderSelectedDates() {
            const container = document.getElementById('selected-dates-container');
            document.getElementById('selected-date-count').innerText = selectedBatchDates.length;

            if (selectedBatchDates.length === 0) {
                container.innerHTML = `<span class="text-slate-400 text-xs self-center px-2">尚未加入任何日期</span>`;
                return;
            }

            container.innerHTML = selectedBatchDates.map(date => `
                <span class="inline-flex items-center text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-xl border border-indigo-200 shadow-sm">
                    <i class="fa-regular fa-calendar mr-1.5 text-indigo-500"></i>${date}
                    <button type="button" onclick="removeSelectedDate('${date}')" class="ml-2 text-indigo-400 hover:text-rose-500 transition">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </span>
            `).join('');
        }

        // 管理員清單渲染 (加入健壯的篩選容錯處理)
        function renderAdminView() {
            const tbody = document.getElementById('admin-slot-tbody');
            if (!tbody) return;

            const todayStr = getTodayString();
            const selectedMonth = document.getElementById('admin-month-filter')?.value || '';
            const selectedCourse = document.getElementById('admin-course-filter')?.value || 'ALL';
            const countLabel = document.getElementById('admin-filtered-count');

            // 依月份與課程名稱過濾
            let filteredSlots = slots.filter(s => {
                const matchMonth = !selectedMonth || (s.date && s.date.startsWith(selectedMonth));
                const matchCourse = selectedCourse === 'ALL' || s.courseName === selectedCourse;
                return matchMonth && matchCourse;
            });

            const sortedSlots = sortSlotsChronologically(filteredSlots);

            if (countLabel) {
                countLabel.innerText = `共顯示 ${sortedSlots.length} 筆時段（總時段數：${slots.length}）`;
            }

            if (sortedSlots.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400 text-sm">此篩選條件下查無任何開放時段</td></tr>`;
                return;
            }

            tbody.innerHTML = sortedSlots.map(s => {
                const isPast = s.date < todayStr;
                const userList = s.bookedUsers || [];
                return `
                    <tr class="hover:bg-slate-50 transition ${isPast ? 'bg-slate-50/50 opacity-65' : ''}">
                        <td class="px-4 py-3 sm:px-6 sm:py-4 whitespace-nowrap">
                            <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded mr-1">${s.courseName}</span>
                            <span class="font-extrabold text-slate-900 text-sm sm:text-base">${s.date}</span>
                            ${isPast ? '<span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded ml-1 font-bold">已過期</span>' : ''}
                            <div class="text-slate-500 text-xs sm:text-sm font-semibold mt-0.5">${s.time}</div>
                        </td>
                        <td class="px-4 py-3 sm:px-6 sm:py-4 whitespace-nowrap">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-extrabold ${userList.length >= s.capacity ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-700'}">
                                ${userList.length} / ${s.capacity} 人
                            </span>
                        </td>
                        <td class="px-4 py-3 sm:px-6 sm:py-4 whitespace-nowrap">
                            <div class="flex items-center space-x-1">
                                <span class="font-bold text-slate-500 text-xs">NT$</span>
                                <input type="number" value="${s.price}" min="0" 
                                    onchange="updateSinglePrice('${s.id}', this.value)" 
                                    class="w-20 bg-white border border-slate-300 rounded-lg px-2 py-1 text-slate-800 focus:outline-none focus:border-indigo-600 font-extrabold text-sm sm:text-base">
                            </div>
                        </td>
                        <td class="px-4 py-3 sm:px-6 sm:py-4 min-w-[140px]">
                            <span class="text-slate-700 font-medium text-xs sm:text-sm leading-relaxed">${userList.join(', ') || '<span class="text-slate-300 font-normal">無人報名</span>'}</span>
                        </td>
                        <td class="px-4 py-3 sm:px-6 sm:py-4 text-right whitespace-nowrap space-x-1.5">
                            <button onclick="openEditModal('${s.id}')" class="text-amber-600 hover:text-amber-800 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 transition">
                                <i class="fa-solid fa-pen-to-square mr-1"></i>編輯
                            </button>
                            <button onclick="deleteSlot('${s.id}')" class="text-rose-500 hover:text-rose-700 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-lg hover:bg-rose-50 transition">
                                <i class="fa-solid fa-trash mr-1"></i>刪除
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 管理員建立時段
        async function handleCreateSlots(e) {
            e.preventDefault();
            const courseName = document.getElementById('admin-course-name').value.trim() || '一般課程';
            const sH = document.getElementById('admin-start-hour').value;
            const sM = document.getElementById('admin-start-min').value;
            const eH = document.getElementById('admin-end-hour').value;
            const eM = document.getElementById('admin-end-min').value;

            const startTime = `${sH}:${sM}`;
            const endTime = `${eH}:${eM}`;

            if ((parseInt(sH) * 60 + parseInt(sM)) >= (parseInt(eH) * 60 + parseInt(eM))) {
                return alert(`結束時間 (${endTime}) 必須晚於開始時間 (${startTime})！`);
            }
            if (selectedBatchDates.length === 0) return alert('請至少加入一個開放日期！');

            const capacity = parseInt(document.getElementById('admin-capacity').value);
            const price = parseInt(document.getElementById('admin-price').value);
            const timeFormatted = `${startTime} - ${endTime}`;

            const rowsToInsert = selectedBatchDates.map(date => ({
                course_name: courseName,
                date,
                time: timeFormatted,
                capacity,
                price,
                booked_users: []
            }));

            const { error } = await supabaseClient.from('slots').insert(rowsToInsert);
            if (error) return alert('新增失敗：' + error.message);

            selectedBatchDates = [];
            renderSelectedDates();
            await fetchSlotsFromSupabase();
            alert(`已成功批次發布 ${rowsToInsert.length} 個「${courseName}」時段！`);
        }

        // 編輯彈窗邏輯
        function openEditModal(slotId) {
            const slot = slots.find(s => s.id === slotId);
            if (!slot) return;

            document.getElementById('edit-slot-id').value = slot.id;
            document.getElementById('edit-course-name').value = slot.courseName;
            document.getElementById('edit-date').value = slot.date;
            document.getElementById('edit-capacity').value = slot.capacity;
            document.getElementById('edit-price').value = slot.price;

            const timeParts = (slot.time || '').split(' - ');
            if (timeParts.length === 2) {
                const [startH, startM] = timeParts[0].split(':');
                const [endH, endM] = timeParts[1].split(':');

                document.getElementById('edit-start-hour').value = startH || '09';
                document.getElementById('edit-start-min').value = startM || '00';
                document.getElementById('edit-end-hour').value = endH || '10';
                document.getElementById('edit-end-min').value = endM || '00';
            }

            const bookedCount = (slot.bookedUsers || []).length;
            document.getElementById('edit-booked-hint').innerText = `目前已報名：${bookedCount} 人`;

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function handleSaveEditedSlot(e) {
            e.preventDefault();

            const slotId = document.getElementById('edit-slot-id').value;
            const newDate = document.getElementById('edit-date').value;
            const newCapacity = parseInt(document.getElementById('edit-capacity').value);
            const newPrice = parseInt(document.getElementById('edit-price').value);

            const sH = document.getElementById('edit-start-hour').value;
            const sM = document.getElementById('edit-start-min').value;
            const eH = document.getElementById('edit-end-hour').value;
            const eM = document.getElementById('edit-end-min').value;

            const startTime = `${sH}:${sM}`;
            const endTime = `${eH}:${eM}`;

            if ((parseInt(sH) * 60 + parseInt(sM)) >= (parseInt(eH) * 60 + parseInt(eM))) {
                return alert(`結束時間 (${endTime}) 必須晚於開始時間 (${startTime})！`);
            }

            const currentSlot = slots.find(s => s.id === slotId);
            const bookedCount = (currentSlot?.bookedUsers || []).length;
            if (newCapacity < bookedCount) {
                return alert(`人數上限 (${newCapacity}人) 不得低於目前已報名人數 (${bookedCount}人)！`);
            }

            const timeFormatted = `${startTime} - ${endTime}`;

            const { error } = await supabaseClient
                .from('slots')
                .update({
                    date: newDate,
                    time: timeFormatted,
                    capacity: newCapacity,
                    price: newPrice
                })
                .eq('id', slotId);

            if (error) return alert('更新失敗：' + error.message);

            closeEditModal();
            await fetchSlotsFromSupabase();
            alert('時段資訊已成功更新！');
        }

        async function updateSinglePrice(slotId, newPrice) {
            const { error } = await supabaseClient
                .from('slots')
                .update({ price: Number(newPrice) })
                .eq('id', slotId);

            if (error) return alert('修改費用失敗：' + error.message);
            await fetchSlotsFromSupabase();
        }

        async function handleBatchUpdatePrice() {
            const batchPrice = parseInt(document.getElementById('batch-price-input').value);
            if (isNaN(batchPrice) || batchPrice < 0) return alert('請輸入有效的金額！');

            if (confirm(`確定要將全部時段的費用統一改為 NT$ ${batchPrice} 嗎？`)) {
                const { error } = await supabaseClient
                    .from('slots')
                    .update({ price: batchPrice })
                    .neq('price', -1);

                if (error) return alert('整批修改失敗：' + error.message);
                document.getElementById('batch-price-input').value = '';
                await fetchSlotsFromSupabase();
                alert('已完成整批費用調整！');
            }
        }

        async function deleteSlot(slotId) {
            if (confirm('確定要從雲端刪除此時段嗎？')) {
                const { error } = await supabaseClient
                    .from('slots')
                    .delete()
                    .eq('id', slotId);

                if (error) return alert('刪除失敗：' + error.message);
                await fetchSlotsFromSupabase();
            }
        }
    </script>
</body>
</html>
