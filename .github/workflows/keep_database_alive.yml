name: Supabase Keep Alive

on:
  schedule:
    # 每週三與週六上午 08:00 (UTC) 自動執行
    - cron: '0 8 * * 3,6'
  workflow_dispatch: # 也支援手動點擊執行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -s -X GET "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/slots?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
